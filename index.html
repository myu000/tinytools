<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Tools — Final Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&family=Jura:wght@400;600&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#FFFAE3; --text:#1F2F16; --primary:#395B50; --secondary:#96705B; }
    [data-theme="dark"] { --bg:#1F2F16; --text:#F3EFE7; }
    body { margin:0; font-family:'Forum',serif; background:var(--bg) center/cover fixed no-repeat; color:var(--text); transition:background 0.3s ease,color 0.3s ease; }
    header { background:rgba(57,91,80,0.92); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; backdrop-filter:saturate(180%) blur(8px); }
    .brand h1{margin:0;font-family:'Sansita',sans-serif;}
    .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;max-width:1200px;margin:28px auto;padding:0 20px;}
    .card{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,0.2);transition:transform 0.25s ease,box-shadow 0.25s ease,filter 0.25s ease;}
    .card:hover{transform:translateY(-4px);filter:brightness(1.05);box-shadow:0 12px 32px rgba(0,0,0,0.25);}
    .btn,.input,.select{font-family:'Jura',sans-serif;padding:10px;border-radius:10px;border:none;}
    .btn{background:var(--primary);color:#fff;cursor:pointer;} .btn.secondary{background:var(--secondary);}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
    #timeDisplay{font-family:'Jura',sans-serif;font-size:2rem;text-align:center;margin:14px 0;}
    .player audio{width:100%;}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px;}
    .thumb{border-radius:10px;overflow:hidden;height:90px;position:relative;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .thumb button{position:absolute;bottom:6px;right:6px;font-size:0.8rem;padding:4px 6px;border:none;border-radius:6px;background:rgba(0,0,0,0.5);color:#fff;}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>Tiny Tools</h1><span>Creative & Focus Hub</span></div>
    <div>
      <select id="envSelect" class="select">
        <option value="relax">Relax</option><option value="study">Study</option>
        <option value="focus">Focus</option><option value="creative">Creative</option>
        <option value="default">Default</option>
      </select>
      <button id="shuffleWallpaper" class="btn secondary">Shuffle wallpaper</button>
      <button id="themeToggle" class="btn">Theme</button>
    </div>
  </header>

  <main class="dashboard">
    <!-- Wallpapers -->
    <section class="card">
      <h3>Wallpapers</h3>
      <div class="row">
        <input id="wallpaperUrl" class="input" placeholder="Paste image URL" />
        <button class="btn" onclick="addWallpaperUrl()">Add</button>
      </div>
      <div class="row">
        <input id="wallpaperFile" class="input" type="file" accept="image/*" />
        <button class="btn secondary" onclick="addWallpaperFile()">Upload</button>
      </div>
      <div class="row">
        <button class="btn" onclick="shuffleCustomWallpapers()">Shuffle mine</button>
        <button class="btn secondary" onclick="clearWallpapers()">Clear</button>
      </div>
      <div id="wallpaperThumbs" class="thumbs"></div>
    </section>

    <!-- Music -->
    <section class="card" id="musicCard">
      <h3>Mood‑to‑Music</h3>
      <select id="moodSelect" class="select" onchange="playMoodMusic()">
        <option value="">Select mood</option>
        <option value="calm">Calm</option>
        <option value="energized">Energized</option>
        <option value="focused">Focused</option>
        <option value="wistful">Wistful</option>
      </select>
      <div class="row">
        <input id="musicUrl" class="input" placeholder="Paste MP3 URL" />
        <button class="btn" onclick="addMusicUrl()">Add</button>
      </div>
      <div class="row">
        <input id="musicFile" class="input" type="file" accept="audio/*" />
        <button class="btn secondary" onclick="addMusicFile()">Upload</button>
      </div>
      <div id="musicPlayer" class="player"></div>
    </section>

    <!-- Prompt Shuffle -->
    <section class="card">
      <h3>Prompt Shuffle</h3>
      <button class="btn" onclick="shufflePrompt()">Shuffle prompt</button>
      <p id="promptText">Click shuffle to get a prompt.</p>
      <div id="writingArea"><textarea id="writingText" placeholder="Start writing..."></textarea><p id="wordCount">Words: 0</p></div>
    </section>

    <!-- Habit Garden -->
    <section class="card"><h3>Habit Garden</h3><input id="habitInput" class="input" placeholder="Add habit..." /><button class="btn" onclick="addHabit()">Add</button><div id="habitList"></div></section>

    <!-- Clock Tool -->
    <section class="card"><h3>Clock Tool</h3>
      <select id="modeSelect" class="select" onchange="switchMode()"><option value="pomodoro">Pomodoro</option><option value="stopwatch">Stopwatch</option><option value="countdown">Countdown</option></select>
      <div id="timeDisplay">00:25:00</div>
      <button class="btn" onclick="startTimer()">Start</button><button class="btn secondary" onclick="pauseTimer()">Pause</button><button class="btn" onclick="resetTimer()">Reset</button>
      <div id="stats"></div>
    </section>
  </main>

  <script>
    /* Wallpapers */
    const envSelect=document.getElementById('envSelect'), shuffleWallpaperBtn=document.getElementById('shuffleWallpaper');
    const wallpaperQueries={relax:"forest,beach",study:"library,desk",focus:"dark,minimal",creative:"abstract,art",default:"aesthetic,workspace"};
    function getWallpapers(){return JSON.parse(localStorage.getItem('wallpapers')||'[]');}
    function setWallpapers(list){localStorage.setItem('wallpapers',JSON.stringify(list));}
    function setBackground(url){document.body.style.backgroundImage=`url('${url}')`;localStorage.setItem('lastWallpaper',url);}
    function applyEnvBackground(env){const q=wallpaperQueries[env]||wallpaperQueries.default;const url=`https://source.unsplash.com/1600x900/?${encodeURIComponent(q)}&sig=${Math.random()}`;setBackground(url);localStorage.setItem('env',env);}
    shuffleWallpaperBtn.addEventListener('click',()=>{const env=envSelect.value||'default';const custom=getWallpapers();if(custom.length){const pick=custom[Math.floor(Math.random()*custom.length)    ... // continuing from shuffleWallpaperBtn.addEventListener

    }); // end shuffleWallpaperBtn

    function addWallpaperUrl(){
      const url=document.getElementById('wallpaperUrl').value.trim();
      if(!url) return;
      const list=getWallpapers(); list.push({url});
      setWallpapers(list); renderThumbs();
      document.getElementById('wallpaperUrl').value='';
    }
    function addWallpaperFile(){
      const file=document.getElementById('wallpaperFile').files[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        const list=getWallpapers(); list.push({url:reader.result});
        setWallpapers(list); renderThumbs();
      };
      reader.readAsDataURL(file);
    }
    function removeWallpaper(idx){
      const list=getWallpapers(); list.splice(idx,1);
      setWallpapers(list); renderThumbs();
    }
    function useWallpaper(idx){
      const list=getWallpapers(); const item=list[idx];
      if(item) setBackground(item.url);
    }
    function shuffleCustomWallpapers(){
      const list=getWallpapers(); if(!list.length) return;
      const item=list[Math.floor(Math.random()*list.length)];
      setBackground(item.url);
    }
    function clearWallpapers(){
      localStorage.removeItem('wallpapers'); renderThumbs();
    }
    function renderThumbs(){
      const wrap=document.getElementById('wallpaperThumbs'); wrap.innerHTML='';
      getWallpapers().forEach((w,idx)=>{
        const div=document.createElement('div'); div.className='thumb';
        div.innerHTML=`
          <img src="${w.url}" alt="wallpaper"/>
          <button onclick="useWallpaper(${idx})">Use</button>
          <button style="left:6px;right:auto;" onclick="removeWallpaper(${idx})">Delete</button>
        `;
        wrap.appendChild(div);
      });
    }

    /* ---------- Music: defaults + user overrides ---------- */
    const defaultTracks = {
      calm: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      energized: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      focused: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      wistful: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
    };
    function getMusic(){ return JSON.parse(localStorage.getItem('musicTracks')||'{}'); }
    function setMusic(obj){ localStorage.setItem('musicTracks',JSON.stringify(obj)); }

    function playMoodMusic(){
      const mood=document.getElementById('moodSelect').value;
      if(!mood) return;
      const userTracks=getMusic()[mood]||[];
      let url;
      if(userTracks.length){
        url=userTracks[Math.floor(Math.random()*userTracks.length)];
      } else {
        url=defaultTracks[mood];
      }
      document.getElementById('musicPlayer').innerHTML=`
        <h4>${mood.charAt(0).toUpperCase()+mood.slice(1)} Mode</h4>
        <audio controls autoplay loop>
          <source src="${url}" type="audio/mpeg">
        </audio>
      `;
    }
    function addMusicUrl(){
      const url=document.getElementById('musicUrl').value.trim();
      const mood=document.getElementById('moodSelect').value;
      if(!url||!mood) return;
      const obj=getMusic(); if(!obj[mood]) obj[mood]=[];
      obj[mood].push(url); setMusic(obj);
      document.getElementById('musicUrl').value='';
      playMoodMusic();
    }
    function addMusicFile(){
      const file=document.getElementById('musicFile').files[0];
      const mood=document.getElementById('moodSelect').value;
      if(!file||!mood) return;
      const reader=new FileReader();
      reader.onload=()=>{
        const obj=getMusic(); if(!obj[mood]) obj[mood]=[];
        obj[mood].push(reader.result); setMusic(obj);
        playMoodMusic();
      };
      reader.readAsDataURL(file);
    }

    /* ---------- Prompt Shuffle ---------- */
    function shufflePrompt(){
      const prompts=[
        "Write about a moment that changes everything.",
        "Describe a character who hides a secret.",
        "Invent a world where memories are currency.",
        "Start with a line of overheard dialogue.",
        "Describe a place that feels like home but isn’t."
      ];
      const prompt=prompts[Math.floor(Math.random()*prompts.length)];
      document.getElementById('promptText').innerText=prompt;
      document.getElementById('writingText').value='';
      updateWordCount();
    }
    const writingText=document.getElementById('writingText');
    const wordCount=document.getElementById('wordCount');
    writingText.addEventListener('input',()=>{updateWordCount();});
    function updateWordCount(){
      const words=writingText.value.trim().split(/\s+/).filter(Boolean).length;
      wordCount.innerText="Words: "+words;
    }

    /* ---------- Habit Garden ---------- */
    function getHabits(){return JSON.parse(localStorage.getItem('habits')||'[]');}
    function setHabits(list){localStorage.setItem('habits',JSON.stringify(list));}
    function addHabit(){
      const name=document.getElementById('habitInput').value.trim();
      if(!name) return;
      const habits=getHabits(); habits.push({name,history:[]});
      setHabits(habits); document.getElementById('habitInput').value='';
      renderHabits();
    }
    function checkInHabit(idx){
      const habits=getHabits(); const today=new Date().toDateString();
      if(!habits[idx].history.includes(today)){
        habits[idx].history.push(today); setHabits(habits); renderHabits();
      }
    }
    function renderHabits(){
      const wrap=document.getElementById('habitList'); wrap.innerHTML='';
      getHabits().forEach((h,idx)=>{
        const streak=h.history.length;
        let plant="🌱"; if(streak>=3)plant="🌿"; if(streak>=7)plant="🌳";
        const div=document.createElement('div'); div.className='habit';
        div.innerHTML=`
          <h4>${h.name}</h4>
          <p>Status: ${h.history.includes(new Date().toDateString())?"Done today":"Not yet"}</p>
          <div style="font-size:2rem;">${plant}</div>
          <button class="btn" onclick="checkInHabit(${idx})">Check in</button>
        `;
        wrap.appendChild(div);
      });
    }

    /* ---------- Clock Tool ---------- */
    let timer=null,timeLeft=1500,running=false;
    let mode=localStorage.getItem('clockMode')||"pomodoro";
    let pomodoroCompleted=parseInt(localStorage.getItem('pomodoroCompleted')||"0",10);
    function formatTime(sec){
      const h=Math.floor(sec/3600).toString().padStart(2,'0');
      const m=Math.floor((sec%3600)/60).toString().padStart(2,'0');
      const s=(sec%60).toString().padStart(2,'0');
      return `${h}:${m}:${s}`;
    }
    function updateDisplay(){document.getElementById('timeDisplay').innerText=formatTime(timeLeft);}
    function startTimer(){
      if(running)return;running=true;
      timer=setInterval(()=>{
        if(mode==="stopwatch"){timeLeft++;}
        else{timeLeft--;if(timeLeft<=0){clearInterval(timer);running=false;if(mode==="pomodoro"){pomodoroCompleted++;localStorage.setItem('pomodoroCompleted',pomodoroCompleted);document.getElementById('stats').innerText=`Completed Pomodoros: ${pomodoroCompleted}`;}alert("Time's up!");}}
        updateDisplay();
      },1000);
    }
    function pauseTimer(){clearInterval(timer);running=false;}
    function resetTimer(){
      clearInterval(timer);running=false;
      if(mode==="pomodoro")timeLeft=1500;
      if(mode==="stopwatch")timeLeft=0;
      if(mode==="countdown")timeLeft=300;
      updateDisplay();
    }
    function switchMode(){
      mode=document.getElementById('modeSelect').value;
      localStorage.setItem('clockMode',mode);
      resetTimer();
    }

    /* ---------- Init ---------- */
    (function init(){
      const savedTheme=localStorage.getItem('theme')||'light';
      document.documentElement.setAttribute('data-theme',savedTheme);
      const savedEnv=localStorage.getItem('env')||'relax';
      envSelect.value=savedEnv;
      const last=localStorage.getItem('lastWallpaper');
      const custom=getWallpapers();
      if(last){setBackground(last);}
      else if(custom.length){setBackground(custom[custom.length-1].url);}
      else{applyEnvBackground(savedEnv);}
      renderThumbs(); renderHabits(); switchMode();
      document.getElementById('
