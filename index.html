<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny Tools — Creative & Focus Hub</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&family=Jura:wght@400;600&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFAE3;
      --text: #1F2F16;
      --primary: #395B50;
      --secondary: #96705B;
      --accent: #3F6F63;
      --glass: rgba(255, 255, 255, 0.35);
      --shadow-1: 0 8px 24px rgba(0, 0, 0, 0.18);
      --tile-gap: 24px;
      --tile-radius: 20px;
      --tile-pad: 20px;
      --dock-width: 340px;
      --select-bg: rgba(255, 255, 255, 0.30);
      --input-bg: rgba(255, 255, 255, 0.28);
      --menu-bg: rgba(0, 0, 0, 0.65);
      --menu-text: #fff;
    }
    [data-theme="dark"] {
      --bg: #1F2F16;
      --text: #F3EFE7;
      --accent: #78B3A7;
      --glass: rgba(30, 30, 30, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Forum', serif;
      color: var(--text);
      background: var(--bg) center/cover fixed no-repeat;
    }
    header {
      background: rgba(57, 91, 80, 0.92);
      color: #fff;
      padding: 14px 24px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }
    .brand { display: flex; gap: 10px; align-items: baseline; }
    .brand h1 { margin: 0; font-family: 'Sansita', sans-serif; }
    .brand span { font-family: 'Jura', sans-serif; opacity: 0.9; }
    .select, .button {
      font-family: 'Jura', sans-serif;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .select { background: var(--select-bg); color: var(--text); }
    .button { background: var(--secondary); color: #fff; }
    .button.primary { background: var(--primary); }
    .page {
      display: grid;
      grid-template-columns: 1fr var(--dock-width);
      gap: var(--tile-gap);
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 24px;
    }
    @media (max-width: 1100px) {
      .page { grid-template-columns: 1fr; }
      .dock { order: 2; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--tile-gap);
    }
    .dock {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 16px;
    }
    .dock h4 { margin: 0 0 10px; font-family: 'Sansita', sans-serif; }
    .dock-area { display: grid; gap: 12px; }
    .card {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(160%);
      border-radius: var(--tile-radius);
      padding: var(--tile-pad);
      box-shadow: var(--shadow-1);
    }
    .tile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .tile-title { margin: 0; font-family: 'Sansita', sans-serif; }
    .dots-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      line-height: 1;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
    }
    .tile-menu {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--menu-bg);
      color: var(--menu-text);
      border-radius: 12px;
      padding: 8px 10px;
      display: none;
      min-width: 160px;
      z-index: 20;
    }
    .tile-menu.open { display: block; }
    .tile-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .tile-menu button:hover { background: rgba(255, 255, 255, 0.12); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .btn, .input, .select-inline, textarea {
      font-family: 'Jura', sans-serif;
      border: none;
      border-radius: 12px;
      padding: 10px;
    }
    .btn { background: var(--primary); color: #fff; cursor: pointer; }
    .btn.secondary { background: var(--secondary); }
    .input, .select-inline, textarea { background: var(--input-bg); }
    textarea { width: 100%; min-height: 180px; resize: vertical; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; border-radius: 12px; }
    .player iframe { width: 100%; height: 300px; border: 0; }
    #timeDisplay { font-family: 'Jura', sans-serif; font-size: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Tiny Tools</h1>
      <span>Creative & Focus Hub</span>
    </div>
    <div class="top-controls">
      <select id="envSelect" class="select">
        <option value="relax">Relax</option>
        <option value="study">Study</option>
        <option value="focus">Focus</option>
        <option value="creative">Creative</option>
        <option value="default">Default</option>
        <option value="custom">Custom</option>
      </select>
      <button id="shuffleWallpaper" class="button">Shuffle</button>
      <button id="themeToggle" class="button primary">Theme</button>
    </div>
    <div class="layout-controls">
      <select id="layoutSelect" class="select">
        <option value="balanced">Balanced</option>
        <option value="focus">Focus</option>
        <option value="writing">Writing</option>
        <option value="music">Music</option>
      </select>
      <button id="applyLayout" class="button">Apply layout</button>
      <span id="layoutNote">Layout: Balanced</span>
    </div>
  </header>

  <div class="page">
    <main id="grid" class="grid">
      <!-- Wallpapers Tile -->
      <section id="wallpapers" class="card tile" data-tile="wallpapers">
        <div class="tile-header">
          <h3 class="tile-title">Wallpapers</h3>
          <button class="dots-btn">⋯</button>
          <div class="tile-menu">
            <button onclick="shrinkTile('wallpapers')">Move to dock</button>
            <button id="deleteCustomWallpapers">Delete custom wallpapers</button>
          </div>
        </div>
        <div class="row">
          <input type="file" id="wallpaperUpload" accept="image/*">
          <button id="clearCustomWallpapers" class="btn secondary">Clear uploaded</button>
        </div>
        <div id="wallpaperThumbs" class="thumbs"></div>
      </section>

      <!-- Music Tile -->
      <section id="music" class="card tile" data-tile="music">
        <div class="tile-header">
          <h3 class="tile-title">Music</h3>
          <button class="dots-btn">⋯</button>
          <div class="tile-menu">
            <button onclick="shrinkTile('music')">Move to dock</button>
            <button onclick="shufflePlay()">Shuffle play</button>
          </div>
        </div>
        <div class="row">
          <input id="playlistName" class="input" placeholder="New playlist">
          <button class="btn" onclick="createPlaylist()">Create</button>
          <button class="btn secondary" onclick="deletePlaylist()">Delete</button>
        </div>
        <div class="row">
          <select id="playlistSelect" class="select-inline" onchange="renderPlaylist()"></select>
          <button class="btn" onclick="renderPlaylists()">Refresh</button>
          <button class="btn primary" onclick="playPlaylist()">Play</button>
          <button class="btn secondary" onclick="shufflePlay()">Shuffle</button>
        </div>
        <div class="row">
          <input id="musicUrl" class="input" placeholder="Paste YouTube URL">
          <button class="btn secondary" onclick="addTrack()">Add</button>
        </div>
        <div id="playlistTracks" class="stack"></div>
        <div id="musicPlayer" class="player"></div>
      </section>

      <!-- Writing Tile -->
      <section id="writing" class="card tile" data-tile="writing">
  <div class="tile-header">
    <h3 class="tile-title">Writing</h3>
    <button class="dots-btn">⋯</button>
    <div class="tile-menu">
      <button onclick="shrinkTile('writing')">Move to dock</button>
      <button onclick="localStorage.clear(); location.reload()">Clear local data</button>
    </div>
  </div>

  <div class="row">
    <select id="writerMode" class="select-inline" onchange="renderWriterMode()">
      <option value="prompts">Prompts</option>
      <option value="todo">To‑Do</option>
      <option value="free">Free</option>
      <option value="brainstorm">Brainstorm</option>
      <option value="journal">Journal</option>
    </select>
  </div>

  <div id="writerArea" class="stack"></div>

  <!-- Brainstorm Mode -->
<div id="brainstormVisible" class="stack" style="display:none;">
  <p id="ideaText" class="small"></p>
  <div class="row">
    <button class="btn" onclick="generateIdea()">Generate idea</button>
    <button class="btn secondary" onclick="clearIdeas()">Clear</button>
    <button class="btn" onclick="saveBrainstorm()">Save Notes</button>
    <button class="btn secondary" onclick="exportBrainstorm()">Export Notes</button>
  </div>
  <textarea id="brainstormDraft" placeholder="Notes..."></textarea>
</div>

  <!-- Journal Mode -->
  <div id="journalVisible" class="stack" style="display:none;">
    <textarea id="journalText" placeholder="Today's entry..."></textarea>
    <div class="row">
      <button class="btn" onclick="saveJournal()">Save entry</button>
      <button class="btn secondary" onclick="exportJournal()">Export All (TXT)</button>
      <button class="btn" onclick="exportJournalPrintable()">Printable</button>
    </div>
    <div id="journalEntries" class="stack"></div>
  </div>
</section>

      <!-- Habits Tile -->
      <section id="habits" class="card tile" data-tile="habits">
        <div class="tile-header">
          <h3 class="tile-title">Habits</h3>
          <button class="dots-btn">⋯</button>
          <div class="tile-menu">
            <button onclick="shrinkTile('habits')">Move to dock</button>
          </div>
        </div>
        <div class="row">
          <input id="habitInput" class="input" placeholder="Add habit">
          <button class="btn" onclick="addHabit()">Add</button>
        </div>
        <div id="habitList" class="stack"></div>
      </section>

      <!-- Clock Tile -->
      <section id="clock" class="card tile" data-tile="clock">
        <div class="row">
  <select id="modeSelect" class="select-inline" onchange="switchMode()">
    <option value="pomodoro">Pomodoro</option>
    <option value="stopwatch">Stopwatch</option>
    <option value="countdown">Countdown</option>
    <option value="timer">Timer</option>
  </select>
  <button class="btn" onclick="startTimer()">Start</button>
  <button class="btn secondary" onclick="pauseTimer()">Pause</button>
  <button class="btn" onclick="resetTimer()">Reset</button>
</div>

<!-- Pomodoro inputs -->
<div class="row" id="pomodoroInputs">
  <label class="input">Work (min)
    <input id="pomodoroWork" type="number" min="1" value="25" style="width:70px;background:transparent;border:none;">
  </label>
  <label class="input">Break (min)
    <input id="pomodoroBreak" type="number" min="1" value="5" style="width:70px;background:transparent;border:none;">
  </label>
</div>

<!-- Countdown input -->
<div class="row" id="countdownInputs" style="display:none;">
  <label class="input">Countdown (min)
    <input id="countdownMinutes" type="number" min="1" value="5" style="width:70px;background:transparent;border:none;">
  </label>
</div>

<!-- Timer input -->
<div class="row" id="timerInputs" style="display:none;">
  <label class="input">Timer (mm:ss)
    <input id="timerMM" type="number" min="0" value="0" style="width:50px;background:transparent;border:none;">
    <span>:</span>
    <input id="timerSS" type="number" min="0" value="30" style="width:50px;background:transparent;border:none;">
  </label>
</div>

<div id="timeDisplay">25:00</div>
<p id="stats">Completed Pomodoros: 0</p>
      </section>
    </main>

    <!-- Dock Sidebar -->
    <aside class="dock">
      <h4>Mini dock</h4>
      <div id="dockArea" class="dock-area"></div>
    </aside>
  </div>

  <!-- Part 2: Wallpapers + Theme + Menus -->
  <script>
  /* ---------------- WALLPAPERS ---------------- */
  const wallpapers = {
    relax: [
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470"
    ],
    study: [
      "https://i.pinimg.com/736x/0c/91/e7/0c91e79c4024d00d4f590a0fa089e7e0.jpg",
      "https://i.pinimg.com/736x/b6/28/9c/b6289cc1fa53e0a16b68718462ef32de.jpg",
      "https://i.pinimg.com/736x/99/51/56/995156895d4e404bc3219ac544b071ed.jpg"
    ],
    focus: [
      "https://i.pinimg.com/736x/c5/dd/a3/c5dda30b4f4fa740b7d392d2494679b8.jpg",
      "https://i.pinimg.com/736x/13/86/3e/13863e5a80feecfa438c88e460288d46.jpg",
      "https://i.pinimg.com/736x/f9/4e/18/f94e1868e32eb2bc7b0feffb9c8071b9.jpg"
    ],
    creative: [
      "https://i.pinimg.com/1200x/0c/5e/7c/0c5e7c4b722fbbf281ec94b5b2f3ee79.jpg",
      "https://i.pinimg.com/736x/58/e9/ec/58e9ecd7dca392d1681d9d0c3578dec3.jpg"
    ],
    default: [
      "https://i.pinimg.com/736x/bc/f3/25/bcf325624cde6c52a9e115097c98f867.jpg",
      "https://i.pinimg.com/736x/fe/c3/db/fec3db297d630dbcec7a984a3cb7acbf.jpg",
      "https://i.pinimg.com/736x/64/e7/38/64e7384a95add6c4ebf89ab4b9d9d603.jpg"
    ],
    custom: []
  };

  function setBackground(url){
    document.body.style.backgroundImage = `url('${url}')`;
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundAttachment = 'fixed';
    localStorage.setItem('lastWallpaper', url);
  }

  function renderThumbnails(list, env){
    const thumbs = document.getElementById('wallpaperThumbs');
    thumbs.innerHTML = "";
    list.forEach((url, i) => {
      const div = document.createElement('div');
      div.className = "thumb";
      div.style.position = "relative";
      div.innerHTML = `<img src="${url}" alt="wallpaper"/>`;
      div.addEventListener('click', () => setBackground(url));
      if (env === "custom") {
        const del = document.createElement('button');
        del.textContent = "✕";
        del.className = "btn secondary";
        del.style.position = "absolute";
        del.style.top = "6px";
        del.style.right = "6px";
        del.onclick = (e) => {
          e.stopPropagation();
          let custom = JSON.parse(localStorage.getItem('customWallpapers') || '[]');
          custom.splice(i, 1);
          localStorage.setItem('customWallpapers', JSON.stringify(custom));
          wallpapers.custom = custom;
          renderThumbnails(custom, "custom");
        };
        div.appendChild(del);
      }
      thumbs.appendChild(div);
    });
  }

  function applyEnvBackground(env){
    const list = wallpapers[env] || wallpapers.default;
    const url = list[Math.floor(Math.random() * list.length)];
    if (url) setBackground(url);
    renderThumbnails(list, env);
    localStorage.setItem('env', env);
  }

  function loadCustomWallpapers(){
    const custom = JSON.parse(localStorage.getItem('customWallpapers') || '[]');
    wallpapers.custom = custom;
    if ((document.getElementById('envSelect').value || 'default') === 'custom') {
      renderThumbnails(custom, "custom");
    }
  }

  document.getElementById('wallpaperUpload').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const url = ev.target.result;
      setBackground(url);
      let custom = JSON.parse(localStorage.getItem('customWallpapers') || '[]');
      custom.push(url);
      localStorage.setItem('customWallpapers', JSON.stringify(custom));
      wallpapers.custom = custom;
      renderThumbnails(custom, "custom");
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('clearCustomWallpapers').addEventListener('click', () => {
    localStorage.removeItem('customWallpapers');
    wallpapers.custom = [];
    renderThumbnails([], "custom");
  });

  document.getElementById('deleteCustomWallpapers').addEventListener('click', () => {
    localStorage.removeItem('customWallpapers');
    wallpapers.custom = [];
    renderThumbnails([], "custom");
  });

  document.getElementById('envSelect').addEventListener('change', e => applyEnvBackground(e.target.value));
  document.getElementById('shuffleWallpaper').addEventListener('click', () => applyEnvBackground(envSelect.value));

  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  /* ---------------- TILE MENUS ---------------- */
  function closeAllMenus(){
    document.querySelectorAll('.tile-menu.open').forEach(menu => menu.classList.remove('open'));
  }

  document.querySelectorAll('.dots-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const menu = btn.nextElementSibling;
      const isOpen = menu.classList.contains('open');
      closeAllMenus();
      if (!isOpen) {
        menu.classList.add('open');
        const firstBtn = menu.querySelector('button');
        if (firstBtn) firstBtn.focus();
      }
    });
  });

  document.addEventListener('click', e => {
    document.querySelectorAll('.tile-menu.open').forEach(menu => {
      const trigger = menu.previousElementSibling;
      if (!menu.contains(e.target) && (!trigger || !trigger.contains(e.target))) {
        menu.classList.remove('open');
      }
    });
  });

  document.addEventListener('keydown', e => { if (e.key === "Escape") closeAllMenus(); });
  </script>

  <!-- Part 3: Music Logic -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
  /* ---------------- MUSIC ---------------- */
  let ytPlayer, currentPlaylist = [], currentIndex = 0;
  window.playerReady = false;

  function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('musicPlayer', {
    height: '300',
    width: '100%',
    videoId: '',
    playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      'onReady': () => {
        window.playerReady = true;
        // Enable Play buttons once ready
        document.querySelectorAll('#music .btn').forEach(btn=>{
          if(btn.textContent.includes("Play")) btn.disabled = false;
        });
      },
      'onStateChange': onPlayerStateChange
    }
  });
}

// Initially disable Play buttons until ready
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelectorAll('#music .btn').forEach(btn=>{
    if(btn.textContent.includes("Play")) btn.disabled = true;
  });
});

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      currentIndex++;
      if (currentIndex >= currentPlaylist.length) currentIndex = 0;
      if (currentPlaylist.length) ytPlayer.loadVideoById(currentPlaylist[currentIndex]);
    }
  }

  function extractId(url) {
    try {
      const u = new URL(url);
      if (u.hostname.includes("youtu.be")) return u.pathname.split("/")[1];
      if (u.hostname.includes("youtube.com")) {
        if (u.searchParams.has("v")) return u.searchParams.get("v");
        if (u.pathname.includes("/embed/")) return u.pathname.split("/embed/")[1].split(/[?&]/)[0];
      }
    } catch (e) {
      if (/^[\w-]{11}$/.test(url)) return url;
    }
    return "";
  }

  function getPlaylists() { return JSON.parse(localStorage.getItem('playlists') || '{}'); }
  function setPlaylists(obj) { localStorage.setItem('playlists', JSON.stringify(obj)); }

  function createPlaylist() {
    const name = document.getElementById('playlistName').value.trim();
    if (!name) return;
    const pls = getPlaylists();
    if (!pls[name]) pls[name] = [];
    setPlaylists(pls);
    document.getElementById('playlistName').value = "";
    renderPlaylists();
  }

  function deletePlaylist() {
    const name = document.getElementById('playlistSelect').value;
    if (!name) return;
    const pls = getPlaylists();
    delete pls[name];
    setPlaylists(pls);
    renderPlaylists();
    document.getElementById('playlistTracks').innerHTML = "";
  }

  function renderPlaylists() {
    const pls = getPlaylists();
    const sel = document.getElementById('playlistSelect');
    sel.innerHTML = "";
    const names = Object.keys(pls);
    if (!names.length) {
      const opt = document.createElement('option');
      opt.value = "";
      opt.textContent = "No playlists";
      sel.appendChild(opt);
      return;
    }
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      sel.appendChild(opt);
    });
    renderPlaylist();
  }

  function renderPlaylist() {
    const pls = getPlaylists();
    const name = document.getElementById('playlistSelect').value;
    const list = document.getElementById('playlistTracks');
    list.innerHTML = "";
    if (!name || !pls[name]) return;
    pls[name].forEach((id, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">https://youtu.be/${id}</span>
        <button class="btn" onclick="playTrack('${name}',${i})">Play</button>
        <button class="btn secondary" onclick="removeTrack('${name}',${i})">Remove</button>
      `;
      list.appendChild(row);
    });
  }

  function addTrack() {
    const name = document.getElementById('playlistSelect').value;
    const raw = document.getElementById('musicUrl').value.trim();
    if (!name || !raw) return;
    const id = extractId(raw);
    if (!id) { alert("Invalid YouTube link"); return; }
    const pls = getPlaylists();
    if (!pls[name]) pls[name] = [];
    pls[name].push(id);
    setPlaylists(pls);
    document.getElementById('musicUrl').value = "";
    renderPlaylist();
  }

  function removeTrack(name, i) {
    const pls = getPlaylists();
    if (!pls[name]) return;
    pls[name].splice(i, 1);
    setPlaylists(pls);
    renderPlaylist();
  }

  function playPlaylist() {
    if (!window.playerReady || !ytPlayer) { alert("Player not ready yet"); return; }
    const name = document.getElementById('playlistSelect').value;
    const pls = getPlaylists();
    if (!name || !pls[name] || !pls[name].length) return;
    currentPlaylist = pls[name];
    currentIndex = 0;
    ytPlayer.loadVideoById(currentPlaylist[0]);
  }

  function playTrack(name, i) {
    if (!window.playerReady || !ytPlayer) { alert("Player not ready yet"); return; }
    const pls = getPlaylists();
    currentPlaylist = pls[name] || [];
    currentIndex = i;
    ytPlayer.loadVideoById(currentPlaylist[i]);
  }

  function shufflePlay() {
    const name = document.getElementById('playlistSelect').value;
    const pls = getPlaylists();
    if (!name || !pls[name] || !pls[name].length) return;
    currentPlaylist = [...pls[name]];

      const j = Math.floor(Math.random() * (i + 1));
      [currentPlaylist[i], currentPlaylist[j]] = [currentPlaylist[j], currentPlaylist[i]];
    }
    currentIndex = 0;
    if (window.playerReady) ytPlayer.loadVideoById(currentPlaylist[0]);
  }

/* ---------- PROMPTS HELPERS ---------- */
function generateGenrePrompt(genre) {
  const genres = {
    fantasy: [
      "Describe a hidden portal in an ordinary place.",
      "Invent a magical creature with a tragic flaw.",
      "Write about a kingdom ruled by dreams.",
      "Create a spell that backfires in an unexpected way."
    ],
    mystery: [
      "A locked room. A missing key. What happened?",
      "Write a scene where a detective finds the wrong clue.",
      "Describe a character who knows too much.",
      "Invent a mystery that unfolds in reverse."
    ],
    romance: [
      "Two strangers meet during a power outage.",
      "Describe a love letter that was never sent.",
      "Write about a relationship built on a lie.",
      "Invent a moment where silence says everything."
    ],
    "sci-fi": [
      "Design a future where memories are traded.",
      "Write about a robot who dreams of freedom.",
      "Describe a planet where time runs backward.",
      "Invent a technology that changes emotions."
    ],
    drama: [
      "Write a confrontation between parent and child.",
      "Describe a moment of quiet betrayal.",
      "Invent a scene where someone confesses too late.",
      "Create a story where the truth is unbearable."
    ],
    reflective: [
      "Write about a moment that changed your perspective.",
      "Describe a place that feels like home.",
      "What does vulnerability mean to you?",
      "Write a letter to your future self.",
      "Reflect on a decision you regret — or don’t."
    ]
  };

  const pool = genre === "random"
    ? Object.values(genres).flat()
    : genres[genre] || genres.fantasy;

  const random = pool[Math.floor(Math.random() * pool.length)];
  const timestamp = new Date().toLocaleString();
  return `${random} (${timestamp})`;
}

<script>
/* ---------------- CLOCK (clean Pomodoro) ---------------- */
let timerInterval;
let timeLeft = 0;
let running = false;
let mode = "pomodoro";
let pomodoroCount = 0;
let isBreak = false;

function switchMode(){
  mode = document.getElementById('modeSelect').value;
  resetTimer();
}

function startTimer(){
  if(running) return;
  running = true;

  if(mode === "pomodoro"){
    const workMins = parseInt(document.getElementById('pomodoroWork').value) || 25;
    const breakMins = parseInt(document.getElementById('pomodoroBreak').value) || 5;
    timeLeft = (isBreak ? breakMins : workMins) * 60;
  } else if(mode === "countdown"){
    timeLeft = parseInt(document.getElementById('countdownMinutes').value) * 60;
  } else if(mode === "timer"){
    const mm = parseInt(document.getElementById('timerMM').value) || 0;
    const ss = parseInt(document.getElementById('timerSS').value) || 0;
    timeLeft = mm * 60 + ss;
  } else if(mode === "stopwatch"){
    timeLeft = 0;
  }

  updateDisplay();
  timerInterval = setInterval(tick, 1000);
}

function tick(){
  if(mode === "stopwatch"){
    timeLeft++;
    updateDisplay();
  } else {
    if(timeLeft > 0){
      timeLeft--;
      updateDisplay();
      if(timeLeft === 0){
        clearInterval(timerInterval);
        running = false;
        if(mode === "pomodoro"){
          if(!isBreak){
            pomodoroCount++;
            document.getElementById('stats').textContent = "Completed Pomodoros: " + pomodoroCount;
            alert("Work session done! Time for a break.");
          } else {
            alert("Break over! Back to work.");
          }
          isBreak = !isBreak;
          startTimer(); // auto‑start next cycle
        } else {
          alert("Time's up!");
        }
      }
    }
  }
}

function pauseTimer(){
  clearInterval(timerInterval);
  running = false;
}

function resetTimer(){
  clearInterval(timerInterval);
  running = false;
  if(mode === "pomodoro"){
    const workMins = parseInt(document.getElementById('pomodoroWork').value) || 25;
    timeLeft = workMins * 60;
    isBreak = false;
  } else if(mode === "countdown"){
    timeLeft = parseInt(document.getElementById('countdownMinutes').value) * 60;
  } else if(mode === "timer"){
    const mm = parseInt(document.getElementById('timerMM').value) || 0;
    const ss = parseInt(document.getElementById('timerSS').value) || 0;
    timeLeft = mm * 60 + ss;
  } else if(mode === "stopwatch"){
    timeLeft = 0;
  }
  updateDisplay();
}

function updateDisplay(){
  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;
  document.getElementById('timeDisplay').textContent =
    String(minutes).padStart(2,'0') + ":" + String(seconds).padStart(2,'0');
}
</script>
