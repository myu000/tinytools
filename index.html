<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Tools</title>

  <!-- Fonts: Sansita, Jura, Forum -->
  <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&family=Jura:wght@400;600&family=Forum&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFAE3;       /* Cornsilk */
      --card: #FFFFFF;
      --primary: #395B50;  /* Feldgrau */
      --secondary: #96705B;/* Chamoisee */
      --highlight: #E6F5C9;/* Niyaza */
      --text: #1F2F16;     /* Dark green */
      --shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Forum', serif;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 {
      font-family: 'Sansita', sans-serif;
      font-size: 2.5rem;
      margin: 0 0 10px;
    }
    header p {
      font-family: 'Jura', sans-serif;
      font-size: 1.1rem;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      gap: 30px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      background: var(--highlight);
    }
    .card h3 {
      font-family: 'Sansita', sans-serif;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      font-family: 'Forum', serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    .btn, select {
      font-family: 'Jura', sans-serif;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }
    .btn:hover, select:hover {
      background: var(--secondary);
    }

    select {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--secondary);
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--secondary);
      margin: 40px 0 20px;
      font-family: 'Jura', sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tiny Tools</h1>
    <p>Simple utilities for creativity and focus</p>
  </header>

  <main class="container">
    <!-- Mood-to-Music Tool -->
    <div class="card">
      <h3>Mood-to-Music</h3>
      <p>Select your mood and get a playlist suggestion.</p>

      <select id="moodSelect">
        <option value="">-- Choose a mood --</option>
        <option value="calm">Calm</option>
        <option value="focused">Focused</option>
        <option value="energized">Energized</option>
        <option value="wistful">Wistful</option>
      </select>

      <button class="btn" onclick="generatePlaylist()">Generate</button>

      <div id="playlistResult" style="margin-top:15px;"></div>
    </div>

    <!-- Prompt Shuffle Tool -->
    <div class="card">
      <h3>Prompt Shuffle</h3>
      <p id="promptText">Click shuffle to get a prompt.</p>
      <button class="btn" onclick="shufflePrompt()">Shuffle</button>
    </div>

    <!-- Habit Garden Tool -->
    <div class="card">
      <h3>Habit Garden</h3>
      <p id="habitStatus">No check-in yet today.</p>
      <button class="btn" onclick="checkIn()">Check In</button>
      <div id="habitHistory" style="margin-top:15px; font-family:'Forum', serif;"></div>
    </div>
  </main>

  <footer>
    © Tiny Tools — built with muted green calm and premium polish
  </footer>

  <script>
    // Mood-to-Music
    function generatePlaylist() {
      const mood = document.getElementById('moodSelect').value;
      const result = document.getElementById('playlistResult');

      let embed = '';
      if (mood === 'calm') {
        embed = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4sWSpwq3LiO" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
      } else if (mood === 'focused') {
        embed = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXc8kgYqQLMfH" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
      } else if (mood === 'energized') {
        embed = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX8FwnYE6PRvL" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
      } else if (mood === 'wistful') {
        embed = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX2pSTOxoPbx9" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
      } else {
        embed = "<p>Please select a mood first.</p>";
      }

      result.innerHTML = embed;
    }

    // Prompt Shuffle
    const prompts = [
      "Write about a door that shouldn’t be opened.",
      "Describe a memory from the perspective of an object.",
      "Invent a conversation between two strangers on a train.",
      "Write a scene where silence is louder than words.",
      "Imagine a world where time flows backwards."
    ];

    function shufflePrompt() {
      const random = prompts[Math.floor(Math.random() * prompts.length)];
      document.getElementById('promptText').innerText = random;
    }

    // Habit Garden
    function checkIn() {
      const today = new Date().toDateString();
      let history = JSON.parse(localStorage.getItem('habitHistory')) || [];

      if (!history.includes(today)) {
        history.push(today);
        localStorage.setItem('habitHistory', JSON.stringify(history));
      }

      updateHabitStatus();
    }

    function updateHabitStatus() {
      const today = new Date().toDateString();
      const history = JSON.parse(localStorage.getItem('habitHistory')) || [];
      const status = document.getElementById('habitStatus');
      const historyDiv = document.getElementById('habitHistory');

      if (history.includes(today)) {
        status.innerText = "You’ve watered your garden today.";
      } else {
        status.innerText = "No check-in yet today.";
      }

      historyDiv.innerHTML = "<strong>Past check-ins:</strong><br>" + history.join("<br>");
    }

    window.onload = updateHabitStatus;
  </script>
</body>
</html>
