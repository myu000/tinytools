<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tiny Tools — Creative Hub</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&family=Jura:wght@400;600&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FFFAE3;--text:#1F2F16;--primary:#395B50;--secondary:#96705B;--accent:#3F6F63;--glass:rgba(255,255,255,0.35);--shadow-1:0 8px 24px rgba(0,0,0,0.18);--shadow-2:0 12px 32px rgba(0,0,0,0.26);--tile-gap:24px;--tile-radius:20px;--tile-pad:24px;--dock-width:340px;--select-bg:rgba(255,255,255,0.30);--input-bg:rgba(255,255,255,0.28);}
    [data-theme="dark"]{--bg:#1F2F16;--text:#F3EFE7;--accent:#78B3A7;--glass:rgba(30,30,30,0.45);--shadow-1:0 8px 24px rgba(0,0,0,0.35);--shadow-2:0 12px 32px rgba(0,0,0,0.48);--select-bg:rgba(255,255,255,0.20);--input-bg:rgba(255,255,255,0.18);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Forum',serif;color:var(--text);background:var(--bg) center/cover fixed no-repeat;}
    header{background:rgba(57,91,80,0.92);color:#fff;padding:18px 40px;display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;}
    .brand{display:flex;gap:12px;align-items:baseline;}
    .brand h1{margin:0;font-family:'Sansita',sans-serif;}
    .brand span{font-family:'Jura',sans-serif;opacity:0.9;}
    .select,.button{font-family:'Jura',sans-serif;border:none;border-radius:12px;padding:10px 12px;cursor:pointer;}
    .select{background:var(--select-bg);color:var(--text);}
    .button{background:var(--secondary);color:#fff;}
    .button.primary{background:var(--primary);}
    .page{display:grid;grid-template-columns:1fr var(--dock-width);gap:var(--tile-gap);max-width:1500px;margin:40px auto;padding:0 40px;}
    @media(max-width:1100px){.page{grid-template-columns:1fr;}.dock{order:2;}}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--tile-gap);align-content:start;}
    .dock{background:rgba(0,0,0,0.08);border-radius:16px;padding:16px;min-height:200px;}
    .dock h4{margin:0 0 10px;font-family:'Sansita',sans-serif;}
    .dock-area{display:grid;grid-template-columns:1fr;gap:12px;}
    .card{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);border-radius:var(--tile-radius);padding:var(--tile-pad);box-shadow:var(--shadow-1);}
    .card h3{margin:0 0 16px;font-family:'Sansita',sans-serif;touch-action:none;cursor:grab;} /* touch-action fix */
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .stack{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
    .btn,.input,.select-inline,textarea{font-family:'Jura',sans-serif;border:none;border-radius:12px;padding:12px;color:var(--text);}
    .btn{background:var(--primary);color:#fff;cursor:pointer;}
    .btn.secondary{background:var(--secondary);}
    .input,.select-inline,textarea{background:var(--input-bg);}
    textarea{width:100%;min-height:220px;resize:vertical;outline:none;}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
    .thumb{border-radius:12px;overflow:hidden;height:110px;position:relative;}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .player{border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.18);}
    .player iframe{display:block;width:100%;height:300px;border:0;}
    @media(max-width:600px){.player iframe{height:200px;}}
    #timeDisplay{font-family:'Jura',sans-serif;font-size:2.2rem;text-align:center;margin:10px 0 6px;}
    @media(max-width:480px){header{padding:14px 16px;grid-template-columns:1fr;gap:10px;} .page{padding:0 16px;margin:20px auto;} .card{padding:16px;} .thumb{height:80px;}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>Tiny Tools</h1><span>Creative & Focus Hub</span></div>
    <div class="top-controls">
      <select id="envSelect" class="select"><option value="relax">Relax</option><option value="study">Study</option><option value="focus">Focus</option><option value="creative">Creative</option><option value="default">Default</option></select>
      <button id="shuffleWallpaper" class="button">Shuffle</button>
      <button id="themeToggle" class="button primary">Theme</button>
    </div>
    <div class="layout-controls">
      <select id="layoutSelect" class="select"><option value="balanced">Balanced</option><option value="focus">Focus</option><option value="writing">Writing</option><option value="music">Music</option></select>
      <button id="applyLayout" class="button">Apply</button>
      <span id="layoutNote">Layout: Balanced</span>
    </div>
  </header>

  <div class="page">
    <main id="grid" class="grid">
      <section class="card tile" data-tile="wallpapers"><h3>Wallpapers</h3><div id="wallpaperThumbs" class="thumbs"></div></section>

      <section class="card tile" data-tile="music">
        <h3>Music</h3>
        <div class="row">
          <input id="playlistName" class="input" placeholder="New playlist name"/>
          <button class="btn" onclick="createPlaylist()">Create</button>
          <button class="btn secondary" onclick="deletePlaylist()">Delete</button>
        </div>
        <div class="row">
          <select id="playlistSelect" class="select-inline" onchange="renderPlaylist()"></select>
          <button class="btn" onclick="renderPlaylist()">Refresh</button>
          <button class="btn primary" onclick="playPlaylist()">Play Playlist</button>
        </div>
        <div class="row">
          <input id="musicUrl" class="input" placeholder="Paste YouTube URL"/>
          <button class="btn secondary" onclick="addTrack()">Add track</button>
        </div>
        <div id="playlistTracks" class="stack"></div>
        <div id="musicPlayer" class="player"></div>
      </section>

      <section class="card tile" data-tile="writing"><h3>Writing</h3><div id="writerArea"></div></section>
      <section class="card tile" data-tile="habits"><h3>Habits</h3><div id="habitList"></div></section>
      <section class="card tile" data-tile="clock"><h3>Clock</h3><div id="timeDisplay">00:25:00</div></section>
       </main>
    <aside class="dock">
      <h4>Mini dock</h4>
      <div id="dockArea" class="dock-area"></div>
    </aside>
  </div>

  <!-- YouTube IFrame API for autoplay -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* Wallpapers */
    const wallpapers={relax:[
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470"
    ],study:[
      "https://i.pinimg.com/736x/0c/91/e7/0c91e79c4024d00d4f590a0fa089e7e0.jpg",
      "https://i.pinimg.com/736x/b6/28/9c/b6289cc1fa53e0a16b68718462ef32de.jpg",
      "https://i.pinimg.com/736x/99/51/56/995156895d4e404bc3219ac544b071ed.jpg"
    ],focus:[
      "https://i.pinimg.com/736x/c5/dd/a3/c5dda30b4f4fa740b7d392d2494679b8.jpg",
      "https://i.pinimg.com/736x/13/86/3e/13863e5a80feecfa438c88e460288d46.jpg",
      "https://i.pinimg.com/736x/f9/4e/18/f94e1868e32eb2bc7b0feffb9c8071b9.jpg"
    ],creative:[
      "https://i.pinimg.com/1200x/0c/5e/7c/0c5e7c4b722fbbf281ec94b5b2f3ee79.jpg",
      "https://i.pinimg.com/736x/5b/f8/8f/5bf88fe147b4f5f591a5e07bb5afd5ec.jpg",
      "https://i.pinimg.com/736x/58/e9/ec/58e9ecd7dca392d1681d9d0c3578dec3.jpg"
    ],default:[
      "https://i.pinimg.com/736x/bc/f3/25/bcf325624cde6c52a9e115097c98f867.jpg",
      "https://i.pinimg.com/736x/fe/c3/db/fec3db297d630dbcec7a984a3cb7acbf.jpg",
      "https://i.pinimg.com/736x/64/e7/38/64e7384a95add6c4ebf89ab4b9d9d603.jpg"
    ]};

    function setBackground(url){document.body.style.backgroundImage=`url('${url}')`;localStorage.setItem('lastWallpaper',url);}
    function applyEnvBackground(env){
      const list=wallpapers[env]||wallpapers.default;
      const pick=list[Math.floor(Math.random()*list.length)];
      setBackground(pick);
      const thumbs=document.getElementById('wallpaperThumbs');thumbs.innerHTML="";
      list.forEach(url=>{const div=document.createElement('div');div.className="thumb";div.innerHTML=`<img src="${url}"/>`;thumbs.appendChild(div);});
      localStorage.setItem('env',env);
    }
    document.getElementById('envSelect').addEventListener('change',e=>applyEnvBackground(e.target.value));
    document.getElementById('shuffleWallpaper').addEventListener('click',()=>applyEnvBackground(document.getElementById('envSelect').value));
    document.getElementById('themeToggle').addEventListener('click',()=>{
      const cur=document.documentElement.getAttribute('data-theme')||'light';
      const next=cur==='light'?'dark':'light';
      document.documentElement.setAttribute('data-theme',next);
      localStorage.setItem('theme',next);
    });

    /* Music with autoplay */
    let ytPlayer,currentPlaylist=[],currentIndex=0;
    function onYouTubeIframeAPIReady(){
      ytPlayer=new YT.Player('musicPlayer',{height:'300',width:'100%',videoId:'',events:{'onStateChange':onPlayerStateChange}});
    }
    function getPlaylists(){return JSON.parse(localStorage.getItem('playlists')||'{}');}
    function setPlaylists(obj){localStorage.setItem('playlists',JSON.stringify(obj));}
    function createPlaylist(){const name=document.getElementById('playlistName').value.trim();if(!name)return;const pls=getPlaylists();if(!pls[name])pls[name]=[];setPlaylists(pls);renderPlaylists();}
    function deletePlaylist(){const name=document.getElementById('playlistSelect').value;if(!name)return;const pls=getPlaylists();delete pls[name];setPlaylists(pls);renderPlaylists();document.getElementById('playlistTracks').innerHTML="";}
    function renderPlaylists(){const pls=getPlaylists();const sel=document.getElementById('playlistSelect');sel.innerHTML="";Object.keys(pls).forEach(n=>{const opt=document.createElement('option');opt.value=n;opt.textContent=n;sel.appendChild(opt);});}
    function renderPlaylist(){const pls=getPlaylists();const name=document.getElementById('playlistSelect').value;const list=document.getElementById('playlistTracks');list.innerHTML="";if(!name||!pls[name])return;pls[name].forEach((url,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<span style="flex:1">${url}</span><button class="btn" onclick="playTrack('${name}',${i})">Play</button>`;list.appendChild(row);});}
    function addTrack(){const name=document.getElementById('playlistSelect').value;const raw=document.getElementById('musicUrl').value.trim();if(!name||!raw)return;const pls=getPlaylists();pls[name].push(raw);setPlaylists(pls);renderPlaylist();}
    function playPlaylist(){const name=document.getElementById('playlistSelect').value;const pls=getPlaylists();if(!name||!pls[name]||!pls[name].length)return;currentPlaylist=pls[name];currentIndex=0;ytPlayer.loadVideoById(extractId(currentPlaylist[0]));}
    function playTrack(name,i){const pls=getPlaylists();currentPlaylist=pls[name]||[];currentIndex=i;ytPlayer.loadVideoById(extractId(currentPlaylist[i]));}
    function onPlayerStateChange(event){if(event.data===YT.PlayerState.ENDED){currentIndex++;if(currentIndex<currentPlaylist.length){ytPlayer.loadVideoById(extractId(currentPlaylist[currentIndex]));}}}
    function extractId(url){try{const u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);if(u.hostname.includes("youtube.com"))return u.searchParams.get("v");}catch(e){}return url;}

    /* Writing, Habits, Clock, Drag & Drop, Layout, Init ... (same as previous full code you had) */
    // ... keep all the writing modes, exports, habit garden, clock logic, drag/drop, dock, layout presets, and init() exactly as in your last full version ...

    function init(){
      const savedTheme=localStorage.getItem('theme')||'light';
      document.documentElement.setAttribute('data-theme',savedTheme);
      const envSaved=localStorage.getItem('env')||'relax';document.getElementById('envSelect').value=envSaved;
      const last=localStorage.getItem('lastWallpaper');if(last)setBackground(last);applyEnvBackground(envSaved);
      renderPlaylists();switchWriterMode();renderHabits();updateDisplay();
      setupDraggableTiles();restoreLayout();
    }
    init();
  </script>
</body>
</html>
