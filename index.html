<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tiny Tools — Creative & Focus Hub</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700&family=Jura:wght@400;600&family=Forum&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#FFFAE3; --text:#1F2F16;
      --primary:#395B50; --secondary:#96705B; --accent:#3F6F63;
      --glass:rgba(255,255,255,0.35);
      --shadow-1:0 8px 24px rgba(0,0,0,0.18);
      --shadow-2:0 12px 32px rgba(0,0,0,0.26);
      --tile-gap:24px; --tile-radius:20px; --tile-pad:24px;
      --dock-width:340px;
      --select-bg:rgba(255,255,255,0.30);
      --input-bg:rgba(255,255,255,0.28);
    }
    [data-theme="dark"] {
      --bg:#1F2F16; --text:#F3EFE7; --accent:#78B3A7;
      --glass:rgba(30,30,30,0.45);
      --shadow-1:0 8px 24px rgba(0,0,0,0.35);
      --shadow-2:0 12px 32px rgba(0,0,0,0.48);
      --select-bg:rgba(255,255,255,0.20);
      --input-bg:rgba(255,255,255,0.18);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Forum',serif;color:var(--text);background:var(--bg) center/cover fixed no-repeat;}
    header{background:rgba(57,91,80,0.92);color:#fff;padding:18px 40px;display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;}
    .brand{display:flex;gap:12px;align-items:baseline;}
    .brand h1{margin:0;font-family:'Sansita',sans-serif;}
    .brand span{font-family:'Jura',sans-serif;opacity:0.9;}
    .select,.button{font-family:'Jura',sans-serif;border:none;border-radius:12px;padding:10px 12px;cursor:pointer;}
    .select{background:var(--select-bg);color:var(--text);}
    .button{background:var(--secondary);color:#fff;}
    .button.primary{background:var(--primary);}
    .page{display:grid;grid-template-columns:1fr var(--dock-width);gap:var(--tile-gap);max-width:1500px;margin:40px auto;padding:0 40px;}
    @media(max-width:1100px){.page{grid-template-columns:1fr;}.dock{order:2;}}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--tile-gap);}
    .dock{background:rgba(0,0,0,0.08);border-radius:16px;padding:16px;}
    .dock h4{margin:0 0 10px;font-family:'Sansita',sans-serif;}
    .dock-area{display:grid;gap:12px;}
    .card{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);border-radius:var(--tile-radius);padding:var(--tile-pad);box-shadow:var(--shadow-1);}
    .card h3{margin:0 0 12px;font-family:'Sansita',sans-serif;cursor:grab;}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .stack{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
    .btn,.input,.select-inline,textarea{font-family:'Jura',sans-serif;border:none;border-radius:12px;padding:12px;}
    .btn{background:var(--primary);color:#fff;cursor:pointer;}
    .btn.secondary{background:var(--secondary);}
    .input,.select-inline,textarea{background:var(--input-bg);}
    textarea{width:100%;min-height:220px;resize:vertical;}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
    .thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
    .player iframe{width:100%;height:300px;border:0;}
    #timeDisplay{font-family:'Jura',sans-serif;font-size:2.2rem;text-align:center;}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>Tiny Tools</h1><span>Creative & Focus Hub</span></div>
    <div class="top-controls">
      <select id="envSelect" class="select">
        <option value="relax">Relax</option>
        <option value="study">Study</option>
        <option value="focus">Focus</option>
        <option value="creative">Creative</option>
        <option value="default">Default</option>
      </select>
      <button id="shuffleWallpaper" class="button">Shuffle</button>
      <button id="themeToggle" class="button primary">Theme</button>
    </div>
    <div class="layout-controls">
      <select id="layoutSelect" class="select">
        <option value="balanced">Balanced</option>
        <option value="focus">Focus</option>
        <option value="writing">Writing</option>
        <option value="music">Music</option>
      </select>
      <button id="applyLayout" class="button">Apply layout</button>
      <span id="layoutNote">Layout: Balanced</span>
    </div>
  </header>

  <div class="page">
    <main id="grid" class="grid">
      <!-- Tiles will be added in Parts 2–6 -->
    </main>
    <aside class="dock"><h4>Mini dock</h4><div id="dockArea" class="dock-area"></div></aside>
  </div>
  <!-- Wallpapers + Theme Script -->
  <script>
    /* ---------------- WALLPAPERS ---------------- */
    const wallpapers={
      relax:[
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
        "https://images.unsplash.com/photo-1506744038136-46273834b3fb",
        "https://images.unsplash.com/photo-1501785888041-af3ef285b470"
      ],
      study:[
        "https://i.pinimg.com/736x/0c/91/e7/0c91e79c4024d00d4f590a0fa089e7e0.jpg",
        "https://i.pinimg.com/736x/b6/28/9c/b6289cc1fa53e0a16b68718462ef32de.jpg",
        "https://i.pinimg.com/736x/99/51/56/995156895d4e404bc3219ac544b071ed.jpg"
      ],
      focus:[
        "https://i.pinimg.com/736x/c5/dd/a3/c5dda30b4f4fa740b7d392d2494679b8.jpg",
        "https://i.pinimg.com/736x/13/86/3e/13863e5a80feecfa438c88e460288d46.jpg",
        "https://i.pinimg.com/736x/f9/4e/18/f94e1868e32eb2bc7b0feffb9c8071b9.jpg"
      ],
      creative:[
        "https://i.pinimg.com/1200x/0c/5e/7c/0c5e7c4b722fbbf281ec94b5b2f3ee79.jpg",
        "https://i.pinimg.com/736x/5b/f8/8f/5bf88fe147b4f5f591a5e07bb5afd5ec.jpg",
        "https://i.pinimg.com/736x/58/e9/ec/58e9ecd7dca392d1681d9d0c3578dec3.jpg"
      ],
      default:[
        "https://i.pinimg.com/736x/bc/f3/25/bcf325624cde6c52a9e115097c98f867.jpg",
        "https://i.pinimg.com/736x/fe/c3/db/fec3db297d630dbcec7a984a3cb7acbf.jpg",
        "https://i.pinimg.com/736x/64/e7/38/64e7384a95add6c4ebf89ab4b9d9d603.jpg"
      ],
      custom:[]
    };

    const envSelect=document.getElementById('envSelect');
    const shuffleWallpaperBtn=document.getElementById('shuffleWallpaper');
    const themeToggle=document.getElementById('themeToggle');
    const wallpaperThumbs=document.getElementById('wallpaperThumbs');
    const wallpaperUpload=document.getElementById('wallpaperUpload');
    const clearCustomWallpapersBtn=document.getElementById('clearCustomWallpapers');

    function setBackground(url){
      document.body.style.backgroundImage=`url('${url}')`;
      document.body.style.backgroundPosition='center';
      document.body.style.backgroundSize='cover';
      document.body.style.backgroundAttachment='fixed';
      localStorage.setItem('lastWallpaper',url);
    }
    function renderThumbnails(list){
      wallpaperThumbs.innerHTML="";
      list.forEach(url=>{
        const div=document.createElement('div');
        div.className="thumb";
        div.innerHTML=`<img src="${url}" alt="wallpaper"/>`;
        div.addEventListener('click',()=>setBackground(url));
        wallpaperThumbs.appendChild(div);
      });
    }
    function applyEnvBackground(env){
      const list=wallpapers[env]||wallpapers.default;
      const pick=list[Math.floor(Math.random()*list.length)];
      if(pick) setBackground(pick);
      renderThumbnails(list);
      localStorage.setItem('env',env);
    }
    function loadCustomWallpapers(){
      const custom=JSON.parse(localStorage.getItem('customWallpapers')||'[]');
      wallpapers.custom=custom;
      if(custom.length && ![...envSelect.options].some(o=>o.value==="custom")){
        const opt=document.createElement('option');
        opt.value="custom"; opt.textContent="Custom";
        envSelect.appendChild(opt);
      }
    }
    wallpaperUpload.addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const url=ev.target.result;
        setBackground(url);
        let custom=JSON.parse(localStorage.getItem('customWallpapers')||'[]');
        custom.push(url);
        localStorage.setItem('customWallpapers',JSON.stringify(custom));
        wallpapers.custom=custom;
        renderThumbnails(custom);
      };
      reader.readAsDataURL(file);
    });
    clearCustomWallpapersBtn.addEventListener('click',()=>{
      localStorage.removeItem('customWallpapers');
      wallpapers.custom=[];
      const opt=[...envSelect.options].find(o=>o.value==="custom");
      if(opt) opt.remove();
      applyEnvBackground(envSelect.value);
    });
    envSelect.addEventListener('change',e=>applyEnvBackground(e.target.value));
    shuffleWallpaperBtn.addEventListener('click',()=>applyEnvBackground(envSelect.value));
    themeToggle.addEventListener('click',()=>{
      const cur=document.documentElement.getAttribute('data-theme')||'light';
      const next=cur==='light'?'dark':'light';
      document.documentElement.setAttribute('data-theme',next);
      localStorage.setItem('theme',next);
    });
  </script>
  <!-- Music / YouTube Playlist Script -->
  <script>
    /* ---------------- MUSIC ---------------- */
    let ytPlayer,currentPlaylist=[],currentIndex=0;window.playerReady=false;

    function onYouTubeIframeAPIReady(){
      ytPlayer=new YT.Player('musicPlayer',{
        height:'300',width:'100%',videoId:'',
        playerVars:{autoplay:0,controls:1,rel:0,modestbranding:1,playsinline:1},
        events:{
          'onReady':e=>{try{e.target.mute();}catch(err){}window.playerReady=true;},
          'onStateChange':onPlayerStateChange
        }
      });
    }
    function onPlayerStateChange(event){
      if(event.data===YT.PlayerState.ENDED){
        currentIndex++;
        if(currentIndex>=currentPlaylist.length) currentIndex=0;
        ytPlayer.loadVideoById(currentPlaylist[currentIndex]);
      }
    }
    function extractId(url){
      try{
        const u=new URL(url);
        if(u.hostname.includes("youtu.be")){
          const id=u.pathname.split("/")[1];
          return (id && id.length===11)?id:"";
        }
        if(u.hostname.includes("youtube.com")){
          if(u.searchParams.has("v")){
            const id=u.searchParams.get("v");
            return (id && id.length===11)?id:"";
          }
          if(u.pathname.includes("/embed/")){
            const id=u.pathname.split("/embed/")[1].split(/[?&]/)[0];
            return (id && id.length===11)?id:"";
          }
        }
      }catch(e){
        if(/^[\w-]{11}$/.test(url)) return url;
      }
      return "";
    }

    function getPlaylists(){return JSON.parse(localStorage.getItem('playlists')||'{}');}
    function setPlaylists(obj){localStorage.setItem('playlists',JSON.stringify(obj));}

    function createPlaylist(){
      const name=document.getElementById('playlistName').value.trim();
      if(!name) return;
      const pls=getPlaylists(); if(!pls[name]) pls[name]=[];
      setPlaylists(pls);
      document.getElementById('playlistName').value="";
      renderPlaylists();
    }
    function deletePlaylist(){
      const name=document.getElementById('playlistSelect').value; if(!name) return;
      const pls=getPlaylists(); delete pls[name]; setPlaylists(pls);
      renderPlaylists(); document.getElementById('playlistTracks').innerHTML="";
    }
    function renderPlaylists(){
      const pls=getPlaylists(); const sel=document.getElementById('playlistSelect'); sel.innerHTML="";
      const names=Object.keys(pls);
      if(!names.length){
        const opt=document.createElement('option'); opt.value=""; opt.textContent="No playlists"; sel.appendChild(opt); return;
      }
      names.forEach(n=>{const opt=document.createElement('option');opt.value=n;opt.textContent=n;sel.appendChild(opt);});
    }
    function renderPlaylist(){
      const pls=getPlaylists(); const name=document.getElementById('playlistSelect').value;
      const list=document.getElementById('playlistTracks'); list.innerHTML="";
      if(!name||!pls[name]) return;
      pls[name].forEach((id,i)=>{
        const row=document.createElement('div'); row.className='row';
        row.innerHTML=`
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">https://youtu.be/${id}</span>
          <button class="btn" onclick="playTrack('${name}',${i})">Play</button>
          <button class="btn secondary" onclick="removeTrack('${name}',${i})">Remove</button>
        `;
        list.appendChild(row);
      });
    }
    function addTrack(){
      const name=document.getElementById('playlistSelect').value;
      const raw=document.getElementById('musicUrl').value.trim();
      if(!name||!raw) return;
      const id=extractId(raw);
      if(!id){alert("Invalid YouTube link");return;}
      const pls=getPlaylists(); if(!pls[name]) pls[name]=[];
      pls[name].push(id); setPlaylists(pls);
      document.getElementById('musicUrl').value="";
      renderPlaylist();
    }
    function removeTrack(name,i){
      const pls=getPlaylists(); if(!pls[name]) return;
      pls[name].splice(i,1); setPlaylists(pls); renderPlaylist();
    }
    function playPlaylist(){
      if(!window.playerReady||!ytPlayer||typeof ytPlayer.loadVideoById!=="function"){
        alert("Player not ready yet");return;
      }
      const name=document.getElementById('playlistSelect').value;
      const pls=getPlaylists(); if(!name||!pls[name]||!pls[name].length) return;
      currentPlaylist=pls[name]; currentIndex=0;
      ytPlayer.loadVideoById(currentPlaylist[0]);
    }
    function playTrack(name,i){
      if(!window.playerReady||!ytPlayer||typeof ytPlayer.loadVideoById!=="function"){
        alert("Player not ready yet");return;
      }
      const pls=getPlaylists(); currentPlaylist=pls[name]||[]; currentIndex=i;
      ytPlayer.loadVideoById(currentPlaylist[i]);
    }
  </script>
  <!-- Writing Suite Script — Part 4 i) -->
  <script>
    /* ---------------- WRITING CORE ---------------- */
    const writerArea = document.getElementById('writerArea');
    const promptsList = [
      "Write about a moment that changes everything.",
      "Describe a character who hides a secret.",
      "Invent a world where memories are currency.",
      "Start with a line of overheard dialogue.",
      "Describe a place that feels like home but isn’t."
    ];

    function renderWriterMode(){
      const mode = document.getElementById('writerMode').value;
      writerArea.innerHTML = "";

      if(mode === "prompts"){
        writerArea.innerHTML = `
          <div class="row">
            <button class="btn" onclick="shufflePrompt()">Shuffle</button>
            <button class="btn secondary" onclick="exportPromptDraft('txt')">Export TXT</button>
            <button class="btn secondary" onclick="exportPromptDraft('md')">Export MD</button>
            <button class="btn" onclick="exportPromptPrintable()">Printable</button>
          </div>
          <p id="promptText" class="small"></p>
          <textarea id="promptDraft" placeholder="Write here..."></textarea>
          <p id="promptWordCount" class="small">Words: 0</p>
        `;
        const pd = document.getElementById('promptDraft');
        pd.value = localStorage.getItem('promptDraft') || "";
        pd.addEventListener('input', ()=>{
          localStorage.setItem('promptDraft', pd.value);
          updateWordCount('promptDraft','promptWordCount');
        });
        shufflePrompt();
        updateWordCount('promptDraft','promptWordCount');
      }

      if(mode === "todo"){
        writerArea.innerHTML = `
          <div class="row">
            <input id="todoInput" class="input" placeholder="Add task..."/>
            <button class="btn" onclick="addTodo()">Add</button>
            <button class="btn secondary" onclick="clearTodos()">Clear all</button>
          </div>
          <ul id="todoList" class="stack"></ul>
        `;
        renderTodos();
      }

      if(mode === "free"){
        writerArea.innerHTML = `
          <div class="row">
            <button class="btn secondary" onclick="exportFreeDraft('txt')">Export TXT</button>
            <button class="btn secondary" onclick="exportFreeDraft('md')">Export MD</button>
            <button class="btn" onclick="exportFreePrintable()">Printable</button>
          </div>
          <textarea id="freeDraft" placeholder="Free writing..."></textarea>
          <p id="freeWordCount" class="small">Words: 0</p>
        `;
        const fd = document.getElementById('freeDraft');
        fd.value = localStorage.getItem('freeDraft') || "";
        fd.addEventListener('input', ()=>{
          localStorage.setItem('freeDraft', fd.value);
          updateWordCount('freeDraft','freeWordCount');
        });
        updateWordCount('freeDraft','freeWordCount');
      }
    }

    /* ---------------- UTILITIES ---------------- */
    function updateWordCount(textareaId,labelId){
      const el = document.getElementById(textareaId), lbl = document.getElementById(labelId);
      if(!el || !lbl) return;
      const words = el.value.trim().split(/\s+/).filter(Boolean).length;
      lbl.innerText = "Words: " + words;
    }
    function shufflePrompt(){
      const prompt = promptsList[Math.floor(Math.random()*promptsList.length)];
      document.getElementById('promptText').innerText = prompt;
      localStorage.setItem('currentPromptTitle', prompt);
    }
    function downloadFile(content, filename){
      const blob = new Blob([content], {type:"text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }
    function openPrintable(title, contentHtml){
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>
      <style>body{font-family:Georgia,serif;margin:40px;color:#222}h1{font-size:24px;margin-bottom:20px}.content{font-size:16px;line-height:1.6}</style>
      </head><body><h1>${title}</h1><div class="content">${contentHtml}</div></body></html>`;
      const w = window.open('', '_blank'); if(!w) return;
      w.document.open(); w.document.write(html); w.document.close();
      setTimeout(()=>w.print(),300);
    }

    /* ---------------- EXPORTS ---------------- */
    function exportPromptDraft(format){
      const title = (localStorage.getItem('currentPromptTitle')||"Prompt Draft").replace(/[^\w\s-]/g,'').trim()||"Prompt Draft";
      let content = document.getElementById('promptDraft').value;
      if(format==='md') content = `# ${title}\n\n${content}`;
      downloadFile(content, `${title}.${format}`);
    }
    function exportPromptPrintable(){
      const title = localStorage.getItem('currentPromptTitle')||"Prompt Draft";
      const content = document.getElementById('promptDraft').value.replace(/\n/g,'<br/>');
      openPrintable(title, content);
    }
    function exportFreeDraft(format){
      const title = "Free Writing";
      let content = document.getElementById('freeDraft').value;
      if(format==='md') content = `# ${title}\n\n${content}`;
      downloadFile(content, `${title}.${format}`);
    }
    function exportFreePrintable(){
      const title = "Free Writing";
      const content = document.getElementById('freeDraft').value.replace(/\n/g,'<br/>');
      openPrintable(title, content);
    }

    /* ---------------- TO‑DO ---------------- */
    function getTodos(){ return JSON.parse(localStorage.getItem('todos')||'[]'); }
    function setTodos(list){ localStorage.setItem('todos', JSON.stringify(list)); }
    function addTodo(){
      const val = document.getElementById('todoInput').value.trim(); if(!val) return;
      const todos = getTodos(); todos.push({text:val, done:false}); setTodos(todos);
      document.getElementById('todoInput').value = ""; renderTodos();
    }
    function toggleTodo(i){
      const todos = getTodos(); todos[i].done = !todos[i].done; setTodos(todos); renderTodos();
    }
    function removeTodo(i){
      const todos = getTodos(); todos.splice(i,1); setTodos(todos); renderTodos();
    }
    function clearTodos(){
      localStorage.removeItem('todos'); renderTodos();
    }
    function renderTodos(){
      const list = document.getElementById('todoList'); if(!list) return;
      list.innerHTML = "";
      getTodos().forEach((t,i)=>{
        const li = document.createElement('li');
        li.innerHTML = `
          <input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo(${i})"/>
          <span style="${t.done?'text-decoration:line-through;opacity:0.7;':''}">${t.text}</span>
          <button class="btn secondary" style="margin-left:8px;" onclick="removeTodo(${i})">x</button>
        `;
        list.appendChild(li);
      });
    }
  </script>
  <!-- Writing Suite Script — Part 4 ii) -->
  <script>
    /* ---------------- BRAINSTORM ---------------- */
    function generateIdea(){
      const seeds=[
        "A tool that saves memories as scents.",
        "A habit that grows into a garden.",
        "A playlist that changes with the weather.",
        "A journal that talks back.",
        "A clock that counts inspiration, not seconds."
      ];
      const idea=seeds[Math.floor(Math.random()*seeds.length)];
      document.getElementById('ideaText').innerText=idea;
      localStorage.setItem('lastIdea',idea);
    }
    function clearIdeas(){
      document.getElementById('ideaText').innerText="";
      localStorage.removeItem('lastIdea');
    }

    /* ---------------- JOURNAL ---------------- */
    function getJournal(){return JSON.parse(localStorage.getItem('journal')||'[]');}
    function setJournal(list){localStorage.setItem('journal',JSON.stringify(list));}
    function saveJournal(){
      const text=document.getElementById('journalText').value.trim(); if(!text) return;
      const entries=getJournal(); const d=new Date();
      entries.unshift({date:d.toLocaleDateString(), time:d.toLocaleTimeString(), text});
      setJournal(entries); document.getElementById('journalText').value=""; renderJournal();
    }
    function renderJournal(){
      const wrap=document.getElementById('journalEntries'); if(!wrap) return; wrap.innerHTML="";
      getJournal().forEach((e,i)=>{
        const div=document.createElement('div'); div.className='card'; div.style.padding='12px';
        div.innerHTML=`
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${e.date} — ${e.time}</strong>
            <button class="btn secondary" onclick="deleteJournal(${i})">Delete</button>
          </div>
          <p class="small" style="margin-top:8px;">${e.text.replace(/\n/g,'<br/>')}</p>
        `;
        wrap.appendChild(div);
      });
    }
    function deleteJournal(i){
      const entries=getJournal(); entries.splice(i,1); setJournal(entries); renderJournal();
    }
    function exportJournal(){
      const entries=getJournal();
      let content=entries.map(e=>`${e.date} ${e.time}\n${e.text}\n`).join('\n');
      downloadFile(content,'Journal.txt');
    }
    function exportJournalPrintable(){
      const entries=getJournal();
      const content=entries.map(e=>`<h3>${e.date} — ${e.time}</h3><p>${e.text.replace(/\n/g,'<br/>')}</p><hr/>`).join('');
      openPrintable('Journal',content);
    }
  </script>
  <!-- Habits Script -->
  <script>
    /* ---------------- HABITS ---------------- */
    function getHabits(){return JSON.parse(localStorage.getItem('habits')||'[]');}
    function setHabits(list){localStorage.setItem('habits',JSON.stringify(list));}

    function addHabit(){
      const name=document.getElementById('habitInput').value.trim();
      if(!name) return;
      const habits=getHabits();
      habits.push({name,history:[]});
      setHabits(habits);
      document.getElementById('habitInput').value="";
      renderHabits();
    }

    function resetAllHabits(){
      localStorage.removeItem('habits');
      renderHabits();
    }

    function checkInHabit(idx){
      const habits=getHabits();
      const today=new Date().toDateString();
      if(!habits[idx].history.includes(today)){
        habits[idx].history.push(today);
        setHabits(habits);
        renderHabits();
      }
    }

    function resetHabit(idx){
      const habits=getHabits();
      habits[idx].history=[];
      setHabits(habits);
      renderHabits();
    }

    function renderHabits(){
      const wrap=document.getElementById('habitList');
      if(!wrap) return;
      wrap.innerHTML="";
      const habits=getHabits();
      habits.forEach((h,idx)=>{
        const streak=h.history.length;
        let plant="🌱";
        if(streak>=3) plant="🌿";
        if(streak>=7) plant="🌳";
        if(streak>=14) plant="🌸";
        if(streak>=30) plant="🌲";
        const badges=[];
        if(streak>=7) badges.push("🔥");
        if(streak>=30) badges.push("🌟");
        if(streak>=100) badges.push("🏆");

        const div=document.createElement('div');
        div.className='card';
        div.style.padding='12px';
        div.innerHTML=`
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${h.name}</strong>
            <div class="small">${h.history.includes(new Date().toDateString())?'Done today':'Not yet'}</div>
          </div>
          <div style="font-size:2rem;margin:6px 0;">${plant}</div>
          <div class="small">${badges.join(" ")}</div>
          <div class="row">
            <button class="btn" onclick="checkInHabit(${idx})">Check in</button>
            <button class="btn secondary" onclick="resetHabit(${idx})">Reset</button>
          </div>
          <p class="small"><strong>History:</strong><br>${h.history.join("<br>")||"No check‑ins yet"}</p>
        `;
        wrap.appendChild(div);
      });
    }
  </script>
  <!-- Clock Script -->
  <script>
    /* ---------------- CLOCK ---------------- */
    let timer=null, timeLeft=1500, running=false;
    let mode=localStorage.getItem('clockMode')||"pomodoro";
    let pomodoroCompleted=parseInt(localStorage.getItem('pomodoroCompleted')||"0",10);

    function formatTime(sec){
      const h=Math.floor(sec/3600).toString().padStart(2,'0');
      const m=Math.floor((sec%3600)/60).toString().padStart(2,'0');
      const s=(sec%60).toString().padStart(2,'0');
      return `${h}:${m}:${s}`;
    }
    function updateDisplay(){
      document.getElementById('timeDisplay').innerText=formatTime(timeLeft);
    }
    function startTimer(){
      if(running) return;
      running=true;
      timer=setInterval(()=>{
        if(mode==="stopwatch"){
          timeLeft++;
        } else {
          timeLeft--;
          if(timeLeft<=0){
            clearInterval(timer); running=false;
            if(mode==="pomodoro"){
              pomodoroCompleted++;
              localStorage.setItem('pomodoroCompleted',pomodoroCompleted);
              document.getElementById('stats').innerText=`Completed Pomodoros: ${pomodoroCompleted}`;
            }
            alert("Time's up!");
          }
        }
        updateDisplay();
      },1000);
    }
    function pauseTimer(){
      clearInterval(timer); running=false;
    }
    function resetTimer(){
      clearInterval(timer); running=false;
      if(mode==="pomodoro"){ timeLeft=25*60; }
      else if(mode==="stopwatch"){ timeLeft=0; }
      else if(mode==="countdown"||mode==="custom"){ timeLeft=5*60; }
      updateDisplay();
    }
    function switchMode(){
      mode=document.getElementById('modeSelect').value;
      localStorage.setItem('clockMode',mode);
      resetTimer();
    }
    document.addEventListener('keydown',(e)=>{
      if(e.code==='Space'){
        const ae=document.activeElement;
        const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable);
        if(typing) return;
        e.preventDefault();
        if(running) pauseTimer(); else startTimer();
      }
    });
  </script>
  <!-- Dock + Layout + Drag-and-Drop Script -->
  <script>
    /* ---------------- DRAG & DROP ---------------- */
    const grid=document.getElementById('grid');
    let drag={tile:null,ghost:null,offsetX:0,offsetY:0};

    function setupDraggableTiles(){
      const tiles=Array.from(grid.querySelectorAll('.tile'));
      tiles.forEach((tile,i)=>{
        tile.dataset.order=tile.dataset.order||String(i+1);
        const handle=tile.querySelector('h3');
        if(!handle) return;
        handle.style.cursor='grab';
        handle.addEventListener('pointerdown',(e)=>{
          const tag=e.target.tagName;
          if(['INPUT','SELECT','TEXTAREA','BUTTON','IFRAME'].includes(tag)) return;
          startDrag(tile,e);
        });
      });
    }
    function startDrag(tile,e){
      const rect=tile.getBoundingClientRect();
      drag.tile=tile;
      drag.offsetX=e.clientX-rect.left;
      drag.offsetY=e.clientY-rect.top;
      drag.ghost=document.createElement('div');
      drag.ghost.className='card';
      drag.ghost.style.position='fixed';
      drag.ghost.style.left=rect.left+'px';
      drag.ghost.style.top=rect.top+'px';
      drag.ghost.style.width=rect.width+'px';
      drag.ghost.style.height=rect.height+'px';
      drag.ghost.style.zIndex='1000';
      drag.ghost.style.opacity='0.9';
      drag.ghost.innerHTML=`<div style="padding:10px;font-family:'Jura',sans-serif;">Moving: ${tile.querySelector('h3')?.textContent||'Tile'}</div>`;
      document.body.appendChild(drag.ghost);
      tile.classList.add('dragging-origin');
      document.addEventListener('pointermove',onDragMove);
      document.addEventListener('pointerup',onDragEnd);
    }
    function onDragMove(e){
      if(!drag.ghost) return;
      const x=e.clientX-drag.offsetX, y=e.clientY-drag.offsetY;
      drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px';
    }
    function onDragEnd(){
      if(drag.ghost){drag.ghost.remove(); drag.ghost=null;}
      drag.tile?.classList.remove('dragging-origin');
      drag.tile=null;
      document.removeEventListener('pointermove',onDragMove);
      document.removeEventListener('pointerup',onDragEnd);
    }

    /* ---------------- DOCK ---------------- */
    const dockArea=document.getElementById('dockArea');
    function shrinkTile(key){
      const tile=document.querySelector(`.tile[data-tile="${key}"]`); if(!tile) return;
      const mini=document.createElement('div'); mini.className='card'; mini.dataset.tile=key;
      mini.innerHTML=`<strong>${key}</strong> <button class="button primary" onclick="expandTile('${key}')">Expand</button>`;
      dockArea.appendChild(mini); tile.style.display='none';
    }
    function expandTile(key){
      const tile=document.querySelector(`.tile[data-tile="${key}"]`); if(!tile) return;
      tile.style.display='';
      const minis=Array.from(dockArea.querySelectorAll('.card')).filter(m=>m.dataset.tile===key);
      minis.forEach(m=>m.remove());
    }

    /* ---------------- LAYOUT PRESETS ---------------- */
    function applyLayoutPreset(name){
      const layouts={
        balanced:['wallpapers','music','writing','habits','clock'],
        focus:['clock','writing','music','habits','wallpapers'],
        writing:['writing','wallpapers','music','clock','habits'],
        music:['music','wallpapers','writing','clock','habits']
      };
      const config=layouts[name]||layouts.balanced;
      config.forEach((key,i)=>{
        const tile=document.querySelector(`.tile[data-tile="${key}"]`);
        if(tile){ tile.style.order=String(i+1); tile.style.display=''; }
      });
    }
    document.getElementById('applyLayout').addEventListener('click',()=>{
      const preset=document.getElementById('layoutSelect').value||'balanced';
      applyLayoutPreset(preset);
      document.getElementById('layoutNote').textContent=`Layout: ${preset.charAt(0).toUpperCase()+preset.slice(1)}`;
    });
  </script>
  <!-- Initialization Script -->
  <script>
    /* ---------------- INIT ---------------- */
    function init(){
      // Theme
      const savedTheme=localStorage.getItem('theme')||'light';
      document.documentElement.setAttribute('data-theme',savedTheme);

      // Wallpapers
      loadCustomWallpapers();
      const envSaved=localStorage.getItem('env')||'relax';
      envSelect.value=envSaved;
      const last=localStorage.getItem('lastWallpaper');
      if(last) setBackground(last); else applyEnvBackground(envSaved);

      // Music
      renderPlaylists();

      // Writing
      renderWriterMode();

      // Habits
      renderHabits();

      // Clock
      document.getElementById('stats').innerText=`Completed Pomodoros: ${pomodoroCompleted}`;
      document.getElementById('modeSelect').value=mode;
      switchMode();

      // Drag + Layout
      setupDraggableTiles();
      applyLayoutPreset(document.getElementById('layoutSelect').value||'balanced');
    }

    document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
